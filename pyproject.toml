[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-chronology"
version = "0.1.0"
requires-python = ">=3.11"
description = "Private evidence projection for useful work"
dependencies = []

[project.scripts]
chronology = "chronology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
